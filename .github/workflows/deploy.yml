name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Rechte, die actions/deploy-pages benötigt
permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment gleichzeitig, laufende Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typen und Astro-Diagnostics prüfen
        run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
