{{ define "module-akkordeons" }}
{{ $data := .Data }}
<div class="px-[20px] py-[40px] xl:px-0 xl:py-[50px] xl:max-w-[1180px] xl:mx-auto">
    <div class="font-headline font-bold text-[24px] leading-[48px] uppercase mb-[20px]">{{ index $data "headline" }}</div>
    {{ $items := index (index $data "accordeonsCollection") "items" }}
    {{ range $items }}
        <div class="accordion-item bg-white mb-[1px]" data-accordion-item>
            <button class="accordion-head" type="button" data-accordion-toggle>
                <span class="accordion-label">{{ index . "label" }}</span>
                <img class="accordion-icon" src="/arrow_up_black.svg" alt="" />
            </button>
            {{ with index . "text" }}
                <div class="accordion-content richtext">{{ safeHTML (index . "html") }}</div>
            {{ end }}
        </div>
    {{ end }}
</div>
{{ end }}
